name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check repository structure
        run: python scripts/check_structure.py
      - name: Scan for credentials and private paths
        run: python scripts/check_private_data.py

  reproduce-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install optional demo dependency
        run: python -m pip install -r requirements-demo.txt
      - name: Rebuild demo and sample outputs
        run: python scripts/make_demo.py
      - name: Verify committed outputs are reproducible
        run: git diff --exit-code -- docs/
